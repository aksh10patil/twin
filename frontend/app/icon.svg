<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none" aria-label="Digital Twin Avatar">
  <defs>
    <clipPath id="helmet-clip">
      <path d="M 118 72 C 152 72, 174 86, 181 111 C 192 115, 197 122, 197 130 C 197 138, 192 145, 181 149 C 174 174, 152 186, 118 186 C 84 186, 62 174, 55 149 C 44 145, 39 138, 39 130 C 39 122, 44 115, 55 111 C 62 86, 84 72, 118 72 Z" />
    </clipPath>
    <clipPath id="visor-clip">
      <rect x="69" y="96" width="98" height="66" rx="32" />
    </clipPath>

    <style>
      .orbit-cw {
        transform-box: fill-box;
        transform-origin: center;
        animation: dt-spin-cw 24s linear infinite;
      }
      .orbit-ccw {
        transform-box: fill-box;
        transform-origin: center;
        animation: dt-spin-ccw 32s linear infinite;
      }
      .twinkle-a {
        transform-box: fill-box;
        transform-origin: center;
        animation: dt-twinkle 3.2s ease-in-out infinite;
      }
      .twinkle-b {
        transform-box: fill-box;
        transform-origin: center;
        animation: dt-twinkle 3.2s ease-in-out 1.6s infinite;
      }
      .bot-body {
        transform-box: fill-box;
        transform-origin: 50% 60%;
        animation: dt-curious-tilt 6.5s ease-in-out infinite;
      }
      .bot-antenna {
        transform-box: fill-box;
        transform-origin: 50% 92%;
        animation: dt-antenna-wobble 6.5s ease-in-out infinite;
      }
      .bot-gaze {
        animation: dt-curious-gaze 6.5s ease-in-out infinite;
      }
      .bot-eyes {
        transform-box: fill-box;
        transform-origin: center;
        animation: dt-blink 6.5s ease-in-out infinite;
      }

      @keyframes dt-spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes dt-spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes dt-twinkle {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.72); opacity: 0.65; }
      }
      @keyframes dt-curious-tilt {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        22% { transform: translateY(-3px) rotate(-4.5deg); }
        48% { transform: translateY(-1px) rotate(0deg); }
        72% { transform: translateY(-3.5px) rotate(5deg); }
      }
      @keyframes dt-antenna-wobble {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-7deg); }
        50% { transform: rotate(2deg); }
        75% { transform: rotate(8deg); }
      }
      @keyframes dt-curious-gaze {
        0%, 100% { transform: translate(0px, 0px); }
        18%, 32% { transform: translate(-3.5px, -1.5px); }
        48%, 55% { transform: translate(0px, 0px); }
        68%, 84% { transform: translate(3.5px, -1.5px); }
      }
      @keyframes dt-blink {
        0%, 44%, 48%, 90%, 94%, 100% { transform: scaleY(1); }
        46%, 92% { transform: scaleY(0.1); }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Outer Revolving Planets & Major Stars -->
  <g class="orbit-cw">
    <circle cx="118" cy="128" r="108" fill="none" />
    <circle cx="56" cy="65" r="6.5" stroke="#7B88EC" stroke-width="3.5" />
    <circle cx="184" cy="195" r="6.5" stroke="#F7D126" stroke-width="3.5" />
    <path class="twinkle-a" d="M 81 35.5 Q 81 42 87.5 42 Q 81 42 81 48.5 Q 81 42 74.5 42 Q 81 42 81 35.5 Z" fill="#FF9A1F" />
    <path class="twinkle-b" d="M 169 49 Q 169 57 177 57 Q 169 57 169 65 Q 169 57 161 57 Q 169 57 169 49 Z" fill="#F7D126" />
    <path class="twinkle-a" d="M 88 198.5 Q 88 206 95.5 206 Q 88 206 88 213.5 Q 88 206 80.5 206 Q 88 206 88 198.5 Z" fill="#F7D126" />
    <circle cx="43" cy="91" r="2.8" fill="#FF9A1F" />
    <circle cx="192" cy="88" r="2.8" fill="#FF9A1F" />
  </g>

  <!-- Inner Counter-Revolving Sparkles & Dots -->
  <g class="orbit-ccw">
    <circle cx="118" cy="128" r="106" fill="none" />
    <circle cx="100" cy="24" r="2" fill="#828CE8" />
    <circle cx="144" cy="54" r="2.5" fill="#828CE8" />
    <circle cx="31" cy="175" r="2" fill="#828CE8" />
    <path class="twinkle-b" d="M 46 185.5 Q 46 191 51.5 191 Q 46 191 46 196.5 Q 46 191 40.5 191 Q 46 191 46 185.5 Z" fill="#7B88EC" />
    <circle cx="111" cy="222" r="2" fill="#828CE8" />
    <circle cx="128" cy="208" r="2.5" fill="#828CE8" />
    <path class="twinkle-a" d="M 151 205.5 Q 151 211 156.5 211 Q 151 211 151 216.5 Q 151 211 145.5 211 Q 151 211 151 205.5 Z" fill="#FF9A1F" />
  </g>

  <!-- Curious Bot Head & Antenna -->
  <g class="bot-body">
    <!-- Antenna -->
    <g class="bot-antenna">
      <ellipse cx="128" cy="64" rx="5" ry="2.5" fill="#D5E2FF" />
      <path
        d="M 103 63 Q 118 53 133 63"
        stroke="#0B0B0F"
        stroke-width="6.5"
        stroke-linecap="round"
      />
      <line
        x1="118"
        y1="57"
        x2="118"
        y2="41"
        stroke="#0B0B0F"
        stroke-width="6.5"
        stroke-linecap="round"
      />
      <circle
        cx="118"
        cy="33"
        r="7.5"
        fill="#FFFFFF"
        stroke="#0B0B0F"
        stroke-width="6.5"
      />
    </g>

    <!-- Outer Helmet Fill + Inner Cel Shading -->
    <g clip-path="url(#helmet-clip)">
      <rect x="35" y="68" width="166" height="122" fill="#D5E2FF" />
      <path d="M 118 72 C 152 72, 174 86, 181 111 C 192 115, 197 122, 197 130 C 197 138, 192 145, 181 149 C 174 174, 152 186, 118 186 C 84 186, 62 174, 55 149 C 44 145, 39 138, 39 130 C 39 122, 44 115, 55 111 C 62 86, 84 72, 118 72 Z" fill="#FFFFFF" transform="translate(-4, -5)" />
    </g>

    <!-- Outer Helmet Broken Outline -->
    <path
      d="M 118 72 C 152 72, 174 86, 181 111 C 192 115, 197 122, 197 130 C 197 138, 192 145, 181 149 C 174 174, 152 186, 118 186 C 84 186, 62 174, 55 149 C 44 145, 39 138, 39 130 C 39 122, 44 115, 55 111 C 62 86, 84 72, 118 72 Z"
      pathLength="100"
      stroke="#0B0B0F"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-dasharray="49.5 2.5 0.1 2.4 39.5 2.5 1.2 2.3"
      stroke-dashoffset="10.5"
    />

    <!-- Inner Visor Fill + Shading + Curious Face -->
    <g clip-path="url(#visor-clip)">
      <rect x="69" y="96" width="98" height="66" fill="#C5D6FF" />
      <rect x="69" y="101" width="98" height="66" rx="30" fill="#DCE6FF" />

      <g class="bot-gaze">
        <!-- Cheeks -->
        <ellipse cx="89" cy="138" rx="6" ry="3.5" fill="#C2D3FB" />
        <ellipse cx="147" cy="138" rx="6" ry="3.5" fill="#C2D3FB" />

        <!-- Eyes -->
        <g class="bot-eyes">
          <circle cx="91" cy="128" r="5.5" fill="#0B0B0F" />
          <circle cx="145" cy="128" r="5.5" fill="#0B0B0F" />
        </g>

        <!-- Smile -->
        <path
          d="M 111 139 Q 118 146 125 139"
          stroke="#0B0B0F"
          stroke-width="5.5"
          stroke-linecap="round"
        />
      </g>
    </g>

    <!-- Inner Visor Outline -->
    <rect
      x="69"
      y="96"
      width="98"
      height="66"
      rx="32"
      stroke="#0B0B0F"
      stroke-width="6.5"
    />
  </g>
</svg>